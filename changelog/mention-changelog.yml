    note: >-
      No RSS, Atom or JSON feed is exposed by the Headway board — .rss, .atom and .json all return
      404, so the only machine-readable read is the dated <time> elements in the page itself.

observations:
  - >-
    Nothing in either changelog announces an API change after September 2023, and the product notes
    stop in February 2025. Read together with the pricing page — where API access is a paid add-on
    rather than an included capability — the API reads as maintained-but-static rather than active.
  - >-
    Every breaking change on record is version-gated behind Accept-Version, which is the right
    mechanism; the gap is that no removal date is ever attached to a deprecation.
