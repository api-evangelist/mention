specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Mention
providerId: mention
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: https://mention.com/en/pricing/
docs: https://mention.com/en/pricing/
tags:
  - Alerts
  - Brand Monitoring
  - Media Monitoring
  - Social Listening
  - Pricing
description: >-
  Plans and pricing as published by Mention on 2026-08-13. This artifact REPLACES a 2026-05-04
  scaffold that invented Free / Professional / Enterprise tiers with fabricated quotas; none of
  those tiers exist. Mention publishes exactly one plan, the Company plan, and it publishes no
  price for it — the pricing page renders the currency symbol with no figure and routes every
  call to action to "Get a demo" / "Request a demo".
plan_count: 1
pricing_model: sales-gated
currencies:
  - USD
  - EUR
  - GBP
billing_periods:
  - monthly
  - annual
annual_discount: >-
  "Pay yearly and get 2 months free". The comparison line reads "Per month, billed yearly - Save
  360$ / 360€ / 360£", which implies a monthly-equivalent list price of 180 in each currency (360
  saved over 2 free months), but Mention does not state that figure, so it is recorded as an
  inference and not as a price.
plans:
  - id: mention-company
    name: Company
    type: enterprise
    price: null
    price_published: false
    currency: null
    billing: monthly or annual
    call_to_action: Request a demo
    description: >-
      "Complete media monitoring solution with advanced social listening, sentiment analysis, and
      competitive intelligence. Tailored to your organization's specific monitoring needs and
      scale." The page says "Starting at $" with no figure.
    included:
      - Real-time mention tracking across social platforms (Facebook, Instagram, Twitter/X, Reddit, TikTok, Pinterest, YouTube and more)
      - Comprehensive web monitoring across news, blogs and forums
      - Review monitoring across 75+ review sites including Google, Facebook, Trustpilot, Amazon and Glassdoor
      - Advanced Boolean search
      - Sentiment analysis and trend identification
      - Competitor benchmarking and analysis
      - Custom reporting and dashboards
      - Share of voice
      - Influence scoring and audience insights
      - Team collaboration (mention assignment, shared alert access, team member roles)
      - Multi-user access controls
      - White-label reporting options
      - Slack, Zapier and other integrations
      - Alerts and notifications
      - Dedicated account manager
      - Custom onboarding and training
      - Priority technical support
    add_ons:
      - name: API access for custom integrations
        included: false
        note: >-
          Verbatim from the plan comparison table: "Not included in this plan — available as a paid
          add-on." This is the single most important commercial fact about the Mention API — it is
          not a capability of the plan, it is a separately priced upsell, and no price for it is
          published anywhere.
      - name: Historical data access
        included: false
        note: '"Not included in this plan — available as a paid add-on." Beyond the standard 2 years of data.'
    limits_published: false
    quota_published: false
    note: >-
      No request quota, alert quota, user count, mention volume or overage rate is published for this
      plan. The API quota is described only in the help center, and only relatively: "The Mention API
      is subject to the same quotas and features as the Mention account."
trial:
  available: true
  url: https://social.agorapulse.com/mention-trial
  length: not published
  card_required: not published
  note: >-
    The trial and demo calls to action both leave mention.com for social.agorapulse.com, the parent
    brand's funnel.
non_profit:
  available: true
  note: 'Pricing FAQ: "We offer discounts for non-profit organisations. Please contact us if interested."'
subscription_terms:
  source: https://mention.com/en/terms-and-conditions/#general-terms-and-conditions
  version: 'Apr 15, 2025'
  seller: Agorapulse SAS
  auto_renewal: true
  cancellation_notice:
    monthly: at least 1 week before the period expires
    annual: at least 90 days before the period expires
  post_expiry: >-
    "Once the paid Subscription Period or the free trial period have ended, the Services will be
    automatically downgraded to those of the 'free' Subscription offer." A free tier is therefore
    referenced in the contract even though the pricing page does not offer one.
observations:
  - Exactly one plan is published, with no price on it. Every path to a number is a demo request.
  - >-
    API access is a paid add-on on the only plan Mention sells, so no published tier grants API
    access by default.
  - >-
    Prior rounds of this catalog carried three invented tiers with invented quotas. They are removed;
    an honest single sales-gated plan is the real measurement.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
