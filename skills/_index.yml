shared_rules:
  - Base URL is https://api.mention.net/api. The streaming operation is served only from https://stream.mention.net/api.
  - Send Accept-Version 1.21 on every request; without it the version comes from the app's settings.
  - Authorization is 'Bearer <access_token>'; the access_token query parameter works but is discouraged.
  - Resolve account_id with GET /accounts/me. It is a composite string, never an integer.
  - Resolve every enumerated value (sources, languages, tones, folders, task types, share roles, notification frequencies) from GET /app/data.
  - PUT is a partial update; omitted properties are left unchanged and server-managed fields are ignored.
  - No idempotency key exists. Before retrying a write that timed out, list the collection and check.
  - Collections page with _links.more (older) and _links.pull (newer); cursors are opaque.
  - On 429, sleep until the unix timestamp in X-Rate-Limit-Reset. There is no Retry-After and no remaining-budget header.
  - Outside 200 and 400, error bodies are HTML by design — do not parse them.
