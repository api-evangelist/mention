aid: mention
name: Mention
description: >-
  Mention is a media monitoring and social listening platform that watches over one billion sources in real time across
  42 languages, covering social networks, news, blogs, forums, video and 75+ review sites. Its JSON-based RESTful API,
  documented at dev.mention.com, gives developers programmatic access to alerts (the standing keyword queries Mention
  crawls for), the mentions those alerts collect, curation by folder/tone/tag, mention tasks assigned to team mates,
  alert sharing and permissions, authors and influencer scoring, aggregate statistics, and a long-lived streaming
  endpoint for real-time delivery. Authentication is a bearer token obtained from a registered app or through an OAuth2
  authorization-code flow, and the API version is selected per request with an Accept-Version header. Mention is sold by
  Agorapulse SAS; API access is a paid add-on rather than an included capability of the published plan.
type: Index
accessModel:
  pricing: sales-gated
  onboarding: demo-request
  trial: true
  try_now: false
  public: false
  label: Contact Sales
  confidence: high
  source:
  - https://mention.com/en/pricing/
  - https://en.support.mention.com/en/articles/1904644-api-access-explained
  generated: '2026-08-13'
  method: searched
  note: >-
    One published plan (Company) with no price on it and a "Request a demo" call to action. A free
    trial exists at social.agorapulse.com/mention-trial. API access is listed as a paid add-on, not
    included in the plan.
