  name: Mention Tasks API
  description: >-
    The Tasks API from Mention — 5 operations for the assignments created on a mention for team mates. assigned_to_account_id is fixed at creation; type, comment and done are updatable. A mention returns its tasks inline — there is no per-mention tasks endpoint.
