- aid: mention:mention-app-api
  name: Mention App API
  description: >-
    The App API from Mention — 1 operation. GET /app/data returns the reference vocabularies every
    other Mention endpoint resolves its enumerated values against: alert sources, alert languages and
    countries, tones, share roles, alert colours, task types, mention folders, mention log types,
    social account types, week days, and the four notification-frequency maps.
