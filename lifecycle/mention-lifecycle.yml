deprecated_operations: []
retired_operations:
  - name: Delete an alert
    note: >-
      Listed in the reference navigation but no such endpoint exists. Mention documents that an alert
      cannot be deleted directly — delete your share on it, and the alert is deleted when its last
      share is. Removed from the OpenAPI in this pass.
  - name: Fetch all tasks of a mention
    note: >-
      Listed in the reference navigation but no such endpoint exists; a mention returns its tasks
      inline. Removed from the OpenAPI in this pass.

ownership:
  note: >-
    Ownership has moved twice and the published surface still reflects both eras. The Security Policy
    (Apr 2022) states Mention Solutions SAS is "ultimately owned by NHST Media Group AS in Norway";
    the General Terms of Sale (Apr 2025) are issued by Agorapulse SAS. The API's own hosts still carry
    the original mention.net domain (api.mention.net, stream.mention.net, web.mention.net).
