    http_status: 200
    state: All Systems Operational
    incidents_last_15_days: 0
  note: >-
    The vanity domain is live. The underlying mention.statuspage.io host redirects to /inactive, so
    status.mention.com is the only working entry point.

sla:
  published: true
  uptime_target: 99.99%
  url: https://mention.com/en/terms-and-conditions/#security-policy
  quote: >-
    "Mention services have a goal of being available 99.99% on a yearly basis. Health status for
    Mention services can be found on status.mention.com."
  note: >-
    Stated as a goal in the Security Policy (version Apr 22, 2022), not as a contractual credit-bearing
    SLA. The General Terms of Sale carry no uptime commitment or service-credit schedule.

