summary: >-
  Mention runs a header-selected version scheme with a dated, human-readable API changelog, and an
  Atlassian status page that breaks out API as its own component. It publishes NO deprecation policy
  and NO Sunset/Deprecation header support: deprecations are announced as changelog lines and the
  words used are "deprecation" and "soft deprecation" with no removal date attached. The API
  changelog has not moved since 2023 and the product release notes have not moved since February
  2025.

versioning:
  scheme: request-header
  header: Accept-Version
  current: '1.21'
  released: '2023-09-06'
  default: the version configured in the calling app's settings page
  granularity: >-
    Only major.minor selects a version; the patch figure denotes bug fixes and is applied
    automatically within its major.minor line.
  docs: https://dev.mention.com/current/src/Changelog.html
  note: >-
    The Overview page ends with "This documentation is about the API version 1.8" while the changelog
    top entry is 1.21 — the reference disagrees with itself about which version it describes.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  notice_period: not published
  note: >-
    There is no deprecation policy page, no notice window, and no RFC 8594 Sunset or Deprecation
    header. Deprecations appear only as changelog prose. Two are on record:
  events:
    - version: '1.19'
      date: '2020-03-31'
      change: Gender chart dimension deprecated for the API from version 19 onward.
      removal_date: not stated
    - version: '1.19'
      date: '2020-03-31'
      change: Gender dimension soft-deprecated for all prior versions.
      removal_date: not stated
  product_deprecations:
    - feature: Publish and Respond
      status: progressively deprecated
      source: https://mention.com/en/pricing/
      note: >-
        Announced on the pricing FAQ, not in the API changelog: "we have decided to progressively
        deprecate the Publish and Respond features in Mention", with users redirected to Agorapulse.
        No date and no API-surface impact statement is given.

breaking_changes:
  policy: not published
  observed:
    - version: '1.21'
      date: '2023-09-06'
      change: >-
        group_id became a mandatory query string parameter on POST /accounts/{account_id}/alerts and
        POST /accounts/{account_id}/dashboards. Previously omissible when the caller had one group.
      breaking: true
    - version: '1.21'
      date: '2023-09-06'
      change: >-
        The alert resource now returns an empty stats field by default; counters must be requested
        explicitly with the stats query parameter.
      breaking: true
    - version: '1.9'
      date: '2016-03-10'
      change: The alerts endpoint became paginated, returning 20 alerts by default.
      breaking: true
  note: >-
    Breaking changes are shipped behind the Accept-Version header, so a pinned caller is insulated —
    but only if it pins. A caller that never sends Accept-Version inherits whatever version its app
    settings record, which is account state rather than a documented default.

