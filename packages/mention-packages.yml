  Registry searches against npm (registry.npmjs.org), PyPI, RubyGems, Packagist and
  Maven Central; the Mention GitHub organization https://github.com/mentionapp; and the
  Mention API reference https://dev.mention.com/current/
summary:
  official_count: 0
  community_count: 2
  note: >-
    Mention publishes NO first-party client library in any package registry. The API reference at
    dev.mention.com documents raw curl only — there is no SDK page, no "libraries" section, and no
    client repository in the company GitHub organization (github.com/mentionapp, 22 public repos,
    all of them PHP/Go infrastructure forks such as Doctrine, Valinor, php-rdkafka and a fork of
    kmyacc; none of them a Mention API client). The only installable wrappers are two abandoned
    community packages, both of which predate the current API version (1.21, 2023) by years.
