  /accounts/{account_id}/stats:
    get:
      operationId: getStats
      summary: Fetch statistics
      description: >-
        Returns aggregate statistics alert by alert over a date range, with an extensive filter surface expressed
        entirely in the query string: date bounds and timezone, interval, folder flags, tone / language / source /
        country / tag filters, and switches for the week-day, per-interval tone, country and influencer breakdowns.
      tags:
      - Stats
      externalDocs:
        description: Mention API reference
        url: https://dev.mention.com/current/src/account/stats/GetStats.html
      parameters:
      - *id007
      - name: alerts[]
        in: query
        required: true
        explode: true
        description: IDs of the alerts statistics are fetched for.
        schema:
          type: array
          items:
            type: integer
        example:
        - 112233
      - name: from
        in: query
        required: false
        description: Statistics are fetched for mentions retrieved after this date.
        schema:
          type: string
        example: '2015-03-27T00:00:00.0'
      - name: to
        in: query
        required: false
        description: Statistics are fetched for mentions retrieved before this date.
        schema:
          type: string
        example: '2016-01-10T00:00:00.0'
      - name: timezone
        in: query
        required: false
        description: Timezone applied to the from and to bounds.
        schema:
          type: string
        example: Europe/Berlin
      - name: interval
        in: query
        required: false
        description: 'Periodicity of the series: P1D daily, P1W weekly, P1M monthly.'
        schema:
          type: string
        example: P1D
      - name: favorite
        in: query
        required: false
        description: Only count mentions in the favorite folder. May be combined with important.
        schema:
          type: boolean
        example: true
      - name: important
        in: query
        required: false
        description: Only count mentions in the important folder. May be combined with favorite.
        schema:
          type: boolean
        example: true
      - name: week_day_stats
        in: query
        required: false
        description: Classify mentions by week day. Cannot coexist with week_day_by_hour_stats.
        schema:
          type: boolean
        example: true
      - name: week_day_by_hour_stats
        in: query
        required: false
        description: Classify mentions by hour of each week day. Cannot coexist with week_day_stats.
        schema:
          type: boolean
        example: true
      - name: tones_per_interval_stats
        in: query
        required: false
        description: Break tones down per interval.
        schema:
          type: boolean
        example: true
      - name: country_stats
        in: query
        required: false
        description: Break mentions down by country.
        schema:
          type: boolean
        example: true
      - name: influencers
        in: query
        required: false
        description: Include influencer statistics.
        schema:
          type: boolean
        example: true
      - name: tones[]
        in: query
        required: false
        explode: true
        description: Only count mentions of the given tones.
        schema:
          type: array
          items:
            type: integer
      - name: languages[]
        in: query
        required: false
        explode: true
        description: Only count mentions in the given language codes.
        schema:
          type: array
          items:
            type: string
      - name: sources[]
        in: query
        required: false
        explode: true
        description: Only count mentions from the given sources.
        schema:
          type: array
          items:
            type: string
      - name: countries[]
        in: query
        required: false
        explode: true
        description: Only count mentions from the given countries.
        schema:
          type: array
          items:
            type: string
      - name: tags[]
        in: query
        required: false
        explode: true
        description: Only count mentions carrying the given tags.
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/AcceptVersion'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Aggregate statistics for the requested alerts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400': *id001
        '401': *id002
        '402': *id003
        '403': *id004
        '404': *id005
        '429': *id006
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Access token passed in the Authorization header, prefixed with 'Bearer '. This is the preferred method. A
        token for your own account is available at the bottom of your app's settings page.
    accessTokenQuery:
      type: apiKey
      in: query
      name: access_token
      description: >-
        The same access token passed in the query string. Supported but discouraged, as it puts the credential in
        the URL.
    oauth2:
      type: oauth2
      description: >-
        Authorization-code flow used to obtain an access token for a third party's Mention account. No scopes are
        defined: a granted token carries full access to the authorizing account.
      flows:
        authorizationCode:
          authorizationUrl: https://web.mention.com/authorize
          tokenUrl: https://web.mention.net/oauth/v2/token
          scopes: {}
  parameters:
    AcceptVersion:
      name: Accept-Version
      in: header
      required: false
      description: >-
        API version to use for this request, e.g. 1.21. When omitted, the version configured in the app's settings
        applies.
      schema:
        type: string
      example: '1.21'
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language used for translated resource fields.
      schema:
        type: string
      example: fr
  responses:
    ValidationError:
      description: Invalid input — query string, body or parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Access was denied — missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    PaymentRequired:
      description: Payment required — the account's plan does not cover this request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    Forbidden:
      description: Access was denied — the token is valid but not permitted on this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
    RateLimited:
      description: >-
        Rate limited. The response carries an X-Rate-Limit-Reset header holding the unix timestamp at which the limit
        resets.
      headers:
        X-Rate-Limit-Reset:
          description: Unix timestamp at which the rate limit resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthError'
  schemas:
    ValidationError:
      type: object
      title: Validation error
      description: >-
        Validation errors on POST and PUT requests are returned with a 400 status code. Field-level messages are keyed
        by field name under form.children and are intended to be displayed directly to the end user when they result
        from a form submission.
      properties:
        form:
          type: object
          properties:
            errors:
              type: array
              items:
                type: string
              description: Request-wide error messages.
            children:
              type: object
              description: Field-specific error messages, keyed by field name.
              additionalProperties:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
    OAuthError:
      type: object
      title: OAuth2 error
      description: Error envelope returned by the API gateway and the OAuth2 endpoints.
      properties:
        error:
          type: string
          example: access_denied
        error_description:
          type: string
          example: OAuth2 authentication required
    Links:
      type: object
      title: Pagination links
      description: >-
        Hypermedia links for cursor pagination. more points at older items and pull at newer items; each is present
        only when applicable.
      properties:
        more:
          $ref: '#/components/schemas/Link'
        pull:
          $ref: '#/components/schemas/Link'
    Link:
      type: object
      properties:
        href:
          type: string
          description: Relative URL to follow.
        params:
          type: object
          description: The query string parameters encoded in href.
          additionalProperties: true
    AlertQuery:
      type: object
      title: Alert query
      description: >-
        Either a basic keyword query or an advanced boolean query_string, discriminated by type. Keywords may contain
        alphanumerics, whitespace and ._@#'&, plus - when preceded by an alphanumeric. At least one of included_keywords
        or required_keywords must be non-empty.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - basic
          - advanced
        included_keywords:
          type: array
          items:
            type: string
          description: At least one must appear in a mention.
        required_keywords:
          type: array
          items:
            type: string
          description: All must appear in a mention.
        excluded_keywords:
          type: array
          items:
            type: string
          description: None may appear in a mention.
        monitored_website:
          $ref: '#/components/schemas/MonitoredWebsite'
        query_string:
          type: string
          description: >-
            Advanced boolean expression, e.g. (NASA AND Discovery) OR (Arianespace AND Ariane). A single clause may
            not mix AND and OR without parentheses.
    MonitoredWebsite:
      type: object
      title: Monitored website
      description: >-
        The domain acts as an included keyword; when block_self is true it also acts as a blocked url. A full URL
        is stripped down to its domain.
      required:
      - domain
      - block_self
      properties:
        domain:
          type: string
          example: www.nasa.gov
        block_self:
          type: boolean
          example: true
    AlertCreate:
      type: object
      title: Alert create
      required:
      - name
      - query
      - languages
      properties:
        name:
          type: string
          description: Human readable identifier of the alert.
          example: NASA and competitors
        query:
          $ref: '#/components/schemas/AlertQuery'
        languages:
          type: array
          items:
            type: string
          description: Language codes to track.
          example:
          - en
          - fr
          - ru
        countries:
          type: array
          items:
            type: string
          example:
          - US
          - RU
        sources:
          type: array
          items:
            type: string
          description: Sources to crawl. Valid values come from app/data.
          example:
          - web
          - twitter
        blocked_sites:
          type: array
          items:
            type: string
        noise_detection:
          type: boolean
        reviews_pages:
          type: array
          items:
            type: string
    AlertUpdate:
      allOf:
      - $ref: '#/components/schemas/AlertCreate'
      title: Alert update
      description: Any property may be omitted; omitted properties are left unchanged.
    Alert:
      type: object
      title: Alert
      properties:
        id:
          type: string
          example: '112233'
        name:
          type: string
        query:
          $ref: '#/components/schemas/AlertQuery'
        languages:
          type: array
          items:
            type: string
        countries:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: string
        blocked_sites:
          type: array
          items:
            type: string
        role:
          type: string
        stats:
          type: object
          additionalProperties: true
          description: >-
            Alert counters. Empty by default since API version 1.21 — request counters with the stats query string
            parameter.
        shares:
          type: array
          items:
            $ref: '#/components/schemas/Share'
        noise_detection:
          type: boolean
        created_at:
          type: string
        updated_at:
          type: string
        quota_used:
          type: integer
        index_version:
          type: integer
          description: Search index version of the alert; determines which mention filters are available to it.
        permissions:
          type: object
          additionalProperties:
            type: boolean
        description:
          type: string
        color:
          type: string
          example: '#05e363'
        connection_type:
          type: string
          enum:
          - main
          - related
          - independent
          description: >-
            main is the first alert created at onboarding, related is a competitor alert created alongside it, independent
            is any later unrelated alert.
        connection_id:
          type: string
          description: 'Set only on related alerts: the id of the main alert.'
    AlertEnvelope:
      type: object
      properties:
        alert:
          $ref: '#/components/schemas/Alert'
    AlertList:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        _links:
          $ref: '#/components/schemas/Links'
    Mention:
      type: object
      title: Mention
      properties:
        id:
          type: string
        alert_id:
          type: integer
        title:
          type: string
        description:
          type: string
        original_url:
          type: string
        clickable_url:
          type: string
        displayable_url:
          type: string
        unique_id:
          type: string
        published_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        country:
          type: string
        favorite:
          type: boolean
        folder:
          type: string
          enum:
          - inbox
          - archive
          - spam
          - trash
        folder_set_by_user:
          type: boolean
        read:
          type: boolean
        tone:
          type: integer
          enum:
          - -1
          - 0
          - 1
        source_type:
          type: string
        source_name:
          type: string
        source_url:
          type: string
        language_code:
          type: string
        picture_url:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        logs:
          type: array
          items:
            type: object
            additionalProperties: true
        children:
          type: object
          properties:
            children:
              type: array
              items:
                type: object
                additionalProperties: true
            total:
              type: integer
            _links:
              $ref: '#/components/schemas/Links'
    MentionList:
      type: object
      properties:
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Mention'
        _links:
          $ref: '#/components/schemas/Links'
    MentionCurate:
      type: object
      title: Mention curation
      description: All properties are optional; send only what changes.
      properties:
        favorite:
          type: boolean
          description: Admin only. Marking a mention favorite also marks it read.
        trashed:
          type: boolean
          description: Admin only.
        read:
          type: boolean
        tags:
          type: array
          description: Tags to attach. Each entry needs at least an id, and the tag must already exist on the alert.
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        folder:
          type: string
          enum:
          - inbox
          - archive
          - spam
          - trash
        tone:
          type: integer
          enum:
          - -1
          - 0
          - 1
          description: Tone key. Valid keys come from app/data.
    AccountCreate:
      type: object
      title: Account create
      required:
      - name
      - email
      - password
      - language_code
      properties:
        name:
          type: string
        email:
          type: string
          format: email
          minLength: 2
          maxLength: 255
        phone:
          type: string
        password:
          type: string
          minLength: 6
          description: At least 6 characters, mixing letters and figures.
        language_code:
          type: string
          description: Two character language code; valid values come from app/data.
        client:
          type: string
          description: Name of the application registering the user. Not updatable.
    AccountUpdate:
      type: object
      title: Account update
      description: >-
        Any property may be omitted. Changing the password requires old_password and new_password rather than password.
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        language_code:
          type: string
        old_password:
          type: string
        new_password:
          type: string
    Account:
      type: object
      title: Account
      properties:
